<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Escuela Secundaria N° 17 Poeta Juan L. Ortiz: bibliografía, trámites, Centro de Estudiantes y novedades." />
    <title>La Poeta · Escuela Secundaria N° 17 "Poeta Juan L. Ortiz"</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo). Ver src/theme/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
